version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: jemima_service_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-jemima_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${DB_NAME:-jemima_service_db}
    ports:
      - "5432:5432"
    volumes:
      - jemima_service_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    container_name: jemima_service_api
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "4000:4000"

volumes:
  jemima_service_pgdata:
    name: jemima_service_pgdata
